name: oie-flow-ui-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

volumes:
  pgdata:
  appdata:
  logs:

services:
  # Build only: the official Dockerfile compiles OIE 4.7.0 (long, done once).
  oie-engine:
    build:
      context: https://github.com/OpenIntegrationEngine/engine.git#v4.7.0
      target: jre-run
      args:
        GRADLE_BUILD_ARGS: ${OIE_GRADLE_BUILD_ARGS:--PdisableSigning=true}
    image: oie-flow-ui-demo-engine:4.7.0
    profiles: [build]

  oie-db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=15000"]
    environment:
      POSTGRES_DB: oie
      POSTGRES_USER: oie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-flow-ui-db}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U oie -d oie"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  oie-app:
    build:
      context: ..
      dockerfile: demo/Dockerfile
      additional_contexts:
        oie-engine: service:oie-engine
    image: oie-flow-ui-demo-oie:4.7.0
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      DATABASE: postgres
      DATABASE_URL: jdbc:postgresql://oie-db:5432/oie
      DATABASE_USERNAME: oie
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-demo-flow-ui-db}
      _MP_HTTPS_PORT: "8443"
      SERVER_ID: ${OIE_SERVER_ID:-3f1c2b9e-6a4d-4e8b-9c1f-0d2e5a7b8c61}
      KEYSTORE_STOREPASS: ${OIE_KEYSTORE_STOREPASS:-demo-flow-ui-store}
      KEYSTORE_KEYPASS: ${OIE_KEYSTORE_KEYPASS:-demo-flow-ui-key}
      _MP_PASSWORD_MINLENGTH: "0"
      _MP_SERVER_INITIALADMINPASSWORD: ${OIE_PASSWORD:-admin}
      TZ: ${TZ:-Europe/Paris}
    configs:
      - source: oie-jvm-options
        target: /opt/engine/conf/custom.vmoptions
    ports:
      - "${OIE_BIND_ADDRESS:-127.0.0.1}:${OIE_HTTPS_PORT:-8444}:8443"
      - "${OIE_BIND_ADDRESS:-127.0.0.1}:${OIE_CHANNEL_PORTS:-8181-8199}:8181-8199"
    volumes:
      - appdata:/opt/engine/appdata
      - logs:/opt/engine/logs
      - ./custom-extensions:/opt/engine/custom-extensions
    depends_on:
      oie-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--no-check-certificate", "-Y", "off", "-T", "8", "-O", "/dev/null", "https://127.0.0.1:8443/oie-webadmin/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: *logging

  # Initializes OIE via its REST API (configuration, channels, groups, tags, RBAC, users and seed messages).
  oie-init:
    image: curlimages/curl:8.21.0
    restart: "no"
    entrypoint: ["/bin/sh", "/oie-init/init-channels.sh"]
    environment:
      OIE_URL: https://oie-app:8443
      OIE_USER: admin
      OIE_PASSWORD: ${OIE_PASSWORD:-admin}
      OIE_DEMO_USER_PASSWORD: ${OIE_DEMO_USER_PASSWORD:-admin}
      OIE_SKIP_FIRST_LOGIN: ${OIE_SKIP_FIRST_LOGIN:-true}
    volumes:
      - ./oie-init:/oie-init:ro
    depends_on:
      oie-app:
        condition: service_healthy
    logging: *logging

  # Continuous demo messages (starts automatically once oie-init completes).
  message-gun:
    image: curlimages/curl:8.21.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/examples/message-gun.sh"]
    environment:
      OIE_URL: https://oie-app:8443/api
      OIE_PASSWORD: ${OIE_PASSWORD:-admin}
      TRAFFIC_INTERVAL: ${TRAFFIC_INTERVAL:-0.2}
    volumes:
      - ./examples:/examples:ro
      - ./oie-init/data:/oie-init/data:ro
    depends_on:
      oie-app:
        condition: service_healthy
      oie-init:
        condition: service_completed_successfully
    logging: *logging

configs:
  oie-jvm-options:
    content: |
      -Xmx${OIE_JAVA_MAX_HEAP:-1g}

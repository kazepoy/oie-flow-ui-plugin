name: oie-flow-ui-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

volumes:
  pgdata:
  appdata:

services:
  # Build only: the official Dockerfile compiles OIE 4.7.0 (long, done once).
  # To reuse an engine image you already have, set OIE_ENGINE_CONTEXT in .env,
  # for example docker-image://fhir-profile-mapper-demo-engine:4.7.0
  oie-engine:
    build:
      context: https://github.com/OpenIntegrationEngine/engine.git#v4.7.0
      target: jre-run
      args:
        GRADLE_BUILD_ARGS: -PdisableSigning=true
    image: oie-flow-ui-demo-engine:4.7.0
    profiles: [build]

  # Starts from the demo database in db/ (loaded only when the volume is created):
  # `docker compose down -v && docker compose up -d` resets the demo.
  oie-db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oie
      POSTGRES_USER: oie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-flow-ui-db}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgdata:/var/lib/postgresql
      - ${OIE_DEMO_DB_DIR:-./db}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U oie -d oie"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  oie-app:
    build:
      context: ..
      dockerfile: demo/Dockerfile
      additional_contexts:
        oie-engine: ${OIE_ENGINE_CONTEXT:-service:oie-engine}
    image: oie-flow-ui-demo-oie:4.7.0
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      DATABASE: postgres
      DATABASE_URL: jdbc:postgresql://oie-db:5432/oie
      DATABASE_USERNAME: oie
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-demo-flow-ui-db}
      _MP_HTTPS_PORT: "8443"
      # Message statistics are stored per server: the demo database needs this id.
      SERVER_ID: 3f1c2b9e-6a4d-4e8b-9c1f-0d2e5a7b8c61
      KEYSTORE_STOREPASS: ${OIE_KEYSTORE_STOREPASS:-demo-flow-ui-store}
      KEYSTORE_KEYPASS: ${OIE_KEYSTORE_KEYPASS:-demo-flow-ui-key}
      _MP_SERVER_INITIALADMINPASSWORD: ${OIE_PASSWORD:-demo-flow-ui-admin}
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "${OIE_BIND_ADDRESS:-127.0.0.1}:${OIE_HTTPS_PORT:-8444}:8443"
      - "${OIE_BIND_ADDRESS:-127.0.0.1}:${OIE_CHANNEL_PORTS:-8181-8199}:8181-8199"
    volumes:
      - appdata:/opt/engine/appdata
    depends_on:
      oie-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--no-check-certificate", "-Y", "off", "-T", "8", "-O", "/dev/null", "https://127.0.0.1:8443/oie-webadmin/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: *logging

  # Optional: messages without end, to see the counters move.
  #   docker compose --profile traffic up -d
  traffic:
    image: curlimages/curl:8.21.0
    profiles: [traffic]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/seed/traffic.sh"]
    environment:
      OIE_URL: https://oie-app:8443/api
      TRAFFIC_INTERVAL: ${TRAFFIC_INTERVAL:-3}
    volumes:
      - ./seed:/seed:ro
    depends_on:
      oie-app:
        condition: service_healthy
    logging: *logging
